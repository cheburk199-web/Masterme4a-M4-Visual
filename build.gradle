buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:4.1.+' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
version = '1.0.0'
group = 'com.masterme4a'
archivesBaseName = 'Masterme4a-M4-Visual'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
minecraft {
    mappings channel: 'snapshot', version: '20210309-1.16.5'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.markers', 'REGISTRIES'; property 'forge.logging.console.level', 'debug'; mods { masterme4a { source sourceSets.main } } }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.39' }
jar { manifest { attributes(['Specification-Title':'masterme4a','Specification-Vendor':'Masterme4a','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.version]) } }
